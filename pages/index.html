<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yarn shop</title>
    <link href="style.css" rel="stylesheet">
    <script src="main/books.js"></script>
    <script src="script.js"></script>
</head>
<body>
<div class="main">
    <div class="header">
        <div class="header-content">
            <section class="logo">
                <img class="logo-img" src="../images/icon.svg" alt="Yarn shop" draggable="false">

                </div>
            </section>
            <section class="section-bag">
                <img class="bag-book" src="../images/cart.png" alt="Cart" draggable="false">

    </div>

    <section class="book-page">
        <div class="main-content"></div>
    </section>
</div>
</body>
</html>
